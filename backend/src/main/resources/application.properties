server.port=8080

# H2: veriler backend/data klasorunde bir dosyada tutulur
spring.datasource.url=jdbc:h2:file:./data/ecommerce
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# JSON alanlari frontend'in bekledigi gibi snake_case: role_id, category_id, card_no ...
spring.jackson.property-naming-strategy=SNAKE_CASE

# hata mesajlari response'ta gorunsun
server.error.include-message=always
